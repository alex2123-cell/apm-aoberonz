# API on Fly.io. Two regions so one data-centre outage doesn't take you down.
# First time:  fly launch --config infra/fly.api.toml --no-deploy   then set secrets:
#   fly secrets set --config infra/fly.api.toml DATABASE_URL=... REDIS_URL=... JWT_SECRET=... ANTHROPIC_API_KEY=...
app = "aoberonz-api"
primary_region = "jnb" # Johannesburg: closest Fly region to Kenya. Check `fly platform regions`.

[build]
  dockerfile = "../backend/Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  USE_QUEUES = "true"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2

  [[http_service.checks]]
    interval = "10s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
