# Background worker (AI processing + distribution). No public port.
app = "aoberonz-worker"
primary_region = "jnb"

[build]
  dockerfile = "../backend/Dockerfile"

[env]
  NODE_ENV = "production"
  USE_QUEUES = "true"

[processes]
  worker = "node dist/workers/index.js"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
